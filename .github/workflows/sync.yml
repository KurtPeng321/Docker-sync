name: Sync MiroTalk Image to Aliyun
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Pull and Tag
        run: |
          docker pull mirotalk/sfu:latest
          docker tag mirotalk/sfu:latest registry.cn-shenzhen.aliyuncs.com/mirotalk-space/sfu:latest
          docker push registry.cn-shenzhen.aliyuncs.com/mirotalk-space/sfu:latest
